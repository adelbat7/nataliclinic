<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f5f5f1">
  <title>404 — העמוד לא נמצא | Natali Clinic</title>
  <style>
    :root {
      --green: #6d8b74;
      --green-dark: #516a58;
      --violet: #7d6071;
      --violet-dark: #634957;
      --cream: #f5f5f1;
      --paper: #fff;
      --text: #333734;
      --muted: #697169;
      --line: rgba(81, 106, 88, 0.2);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--cream);
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(18px, 4vw, 48px) 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: Arial, "Noto Sans Hebrew", "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 14% 12%, rgba(109, 139, 116, 0.15), transparent 29rem),
        radial-gradient(circle at 88% 92%, rgba(125, 96, 113, 0.12), transparent 27rem),
        var(--cream);
    }

    .err-container {
      width: min(100%, 760px);
      padding: clamp(14px, 2.7vw, 24px) clamp(16px, 4vw, 42px) clamp(26px, 4vw, 38px);
      overflow: hidden;
      text-align: center;
      background: rgba(255, 255, 255, 0.93);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 18px 55px rgba(51, 55, 52, 0.1);
    }

    .err-visual {
      margin: 0 0 clamp(18px, 3vw, 28px);
      overflow: hidden;
      background: #e7e9e2;
      border-radius: 20px;
    }

    .err-visual img {
      display: block;
      width: 100%;
      height: auto;
    }

    .err-code {
      margin: 0;
      color: var(--green-dark);
      font: 700 clamp(3.8rem, 11vw, 7rem)/0.9 Georgia, "Times New Roman", serif;
      letter-spacing: 0.08em;
      text-indent: 0.08em;
    }

    .err-title {
      margin: 18px 0 12px;
      color: var(--violet-dark);
      font: 600 clamp(1.25rem, 3.2vw, 1.8rem)/1.35 Georgia, "Times New Roman", serif;
    }

    .err-desc {
      max-width: 590px;
      margin: 0 auto 24px;
      color: var(--muted);
      font-size: clamp(0.96rem, 2.3vw, 1.08rem);
      line-height: 1.7;
    }

    .err-desc span {
      display: block;
    }

    .err-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .err-actions a {
      min-width: 148px;
      padding: 12px 19px;
      color: var(--green-dark);
      font-size: 0.98rem;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      background: var(--paper);
      border: 1px solid var(--green);
      border-radius: 999px;
      transition: transform 0.18s ease, color 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .err-actions a:first-child {
      color: #fff;
      background: var(--green-dark);
      border-color: var(--green-dark);
    }

    .err-actions a:hover {
      color: #fff;
      background: var(--violet);
      border-color: var(--violet);
      box-shadow: 0 8px 20px rgba(99, 73, 87, 0.18);
      transform: translateY(-2px);
    }

    .err-actions a:focus-visible {
      outline: 3px solid rgba(125, 96, 113, 0.35);
      outline-offset: 3px;
    }

    .copyright {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    @media (max-width: 550px) {
      body {
        justify-content: flex-start;
        padding-inline: 10px;
      }

      .err-container {
        border-radius: 20px;
      }

      .err-visual {
        border-radius: 14px;
      }

      .err-actions {
        flex-direction: column;
      }

      .err-actions a {
        width: 100%;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .err-actions a {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="err-container">
    <figure class="err-visual">
      <img
        src="img/404-page.jpg"
        alt="מטפלת של Natali Clinic מחזיקה שלט שמודיע כי העמוד לא נמצא בארבע שפות"
        width="1400"
        height="788"
        fetchpriority="high">
    </figure>

    <p class="err-code" aria-label="Error 404">404</p>
    <h1 class="err-title">העמוד לא נמצא · Страница не найдена</h1>
    <p class="err-desc">
      <span>ייתכן שהעמוד הועבר, נמחק או שהכתובת אינה נכונה.</span>
      <span lang="ru" dir="ltr">Возможно, страница была перемещена, удалена или адрес указан неверно.</span>
    </p>

    <nav class="err-actions" aria-label="קישורים שימושיים">
      <a href="index.html">לעמוד הראשי</a>
      <a href="ru.html" lang="ru" dir="ltr">На главную</a>
      <a href="https://wa.me/972585349125" target="_blank" rel="noopener">WhatsApp</a>
    </nav>
  </main>

  <p class="copyright" dir="ltr">© 2026 Natali Clinic · All rights reserved</p>
</body>
</html>
